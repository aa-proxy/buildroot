image boot.vfat {
	vfat {
		files = {
			boot.scr
		}
	}
	size = 4M
}

image userdata.ext4 {
	name = "userdata"
	ext4 {
		label = "userdata"
		use-mke2fs = true
		features = "^64bit"
	}
	size = 32M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1008K # 1MB - 16KB(GPT)
		gpt-no-backup = true
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1000K # 1MB - 8KB(offset) - 16KB(GPT)
	}

	partition boot {
		offset = 1M
		partition-type-uuid = "U"
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs1 {
		partition-type-uuid = "L"
		image = "rootfs.ext4"
	}

	partition rootfs2 {
		partition-type-uuid = "L"
		image = "rootfs.ext4"
	}

	partition userdata {
		partition-type-uuid = "L"
		image = "userdata.ext4"
	}
}
