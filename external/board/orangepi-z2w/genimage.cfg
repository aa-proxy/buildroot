image userdata.ext4 {
	name = "userdata"
	ext4 {
		label = "userdata"
		use-mke2fs = true
		features = "^64bit"
	}
	size = 32M
}

image sdcard.img {
	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1000K # 1MB - 8KB(offset) - 16KB(GPT)
	}

	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1008K # 1MB - 16KB(GPT)
		gpt-no-backup = true
	}

	partition rootfs1 {
		image = "rootfs.ext4"
	}

	partition rootfs2 {
        image = "rootfs.ext4"
    }

	partition userdata {
		image = "userdata.ext4"
	}
}
